<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact Us | Preview</title><style>:root{color-scheme:dark;--bg:#0c0814;--panel:#1b1127;--edge:#6d6077;--silver:#e5e1eb;--lav:#d9b8ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f5f1fa;font:17px/1.6 Georgia,serif}a{color:inherit}a:focus-visible{outline:3px solid var(--lav);outline-offset:4px}.shell{max-width:1180px;margin:auto;padding:30px 22px}header{border-bottom:1px solid #75617c;background:#160c20}header .shell{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}header strong{font-size:1.3rem;letter-spacing:.08em}nav{display:flex;gap:18px;font:600 14px Arial,sans-serif}section{padding:46px 0;border-bottom:1px solid #55475f}.eyebrow{font:700 12px Arial,sans-serif;letter-spacing:.22em;color:var(--lav);text-transform:uppercase}h1{font-size:clamp(2.2rem,6vw,4.4rem);line-height:1.05;margin:12px 0 18px}h2{font-size:clamp(2rem,4vw,3rem);line-height:1.14;margin:10px 0 15px}h3{font-size:1.2rem;line-height:1.3}.intro{max-width:750px;color:#ddd1e7}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:24px}.card{border:1px solid #55475f;border-radius:14px;overflow:hidden;background:var(--panel)}.card a{display:block;text-decoration:none;height:100%}.card img{width:100%;height:205px;object-fit:cover;display:block}.card .body{padding:18px}.card p{color:#d8cce0;font-size:15px}.feature{grid-column:span 2;display:grid;grid-template-columns:1.1fr 1fr}.feature img{height:100%}.feature .body{display:flex;flex-direction:column;justify-content:center}.button{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;background:#d9b8ff;color:#1b1024;border-radius:999px;padding:12px 22px;font:700 15px Arial,sans-serif;margin:20px 0 0}.button.alt{background:transparent;border:1px solid #d9b8ff;color:#f4eafa}.offers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.offer{padding:22px;background:var(--panel);border:1px solid #55475f;border-radius:14px}.offer .button{margin-top:8px}.contactbox{display:flex;align-items:center;justify-content:space-between;gap:20px;background:linear-gradient(120deg,#231333,#130c20);padding:25px;border:1px solid #665873;border-radius:16px}footer{padding:30px 0;color:#c6baca;font:14px Arial,sans-serif}.notice{background:#352141;padding:10px 20px;font:600 13px Arial,sans-serif;text-align:center;color:#f5e9ff}@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.feature{grid-column:span 2}.offers{grid-template-columns:1fr 1fr}}@media(max-width:600px){.shell{padding:20px 16px}section{padding:30px 0}.grid,.offers{grid-template-columns:1fr}.feature{grid-column:span 1;display:block}.feature img{height:240px}.card img{height:240px}.contactbox{display:block}nav{flex-wrap:wrap}}label{display:block;margin:15px 0;font:600 15px Arial}input,textarea{display:block;width:100%;padding:12px;margin-top:6px;background:#21162c;border:1px solid #867b8d;color:white;border-radius:7px;font:16px Arial}form{max-width:650px}</style></head><body><div class="notice">UNPUBLISHED CONTACT PAGE PREVIEW · Form submission disabled in preview</div><header><div class="shell"><strong>LOVE WINS ERA</strong><nav><a href="./index.html">← Return to About preview</a></nav></div></header><main class="shell"><span class="eyebrow">Contact</span><h1>Contact Us</h1><p>For business inquiries: <a href="mailto:lovewinsera@outlook.com">lovewinsera@outlook.com</a></p><p>Appointments are scheduled online and require a deposit. Unscheduled calls and messages are not available.</p><form onsubmit="event.preventDefault();alert('This is a preview. No message was sent.')"><label>Name*<input name="name" autocomplete="name" required></label><label>Email*<input name="email" autocomplete="email" type="email" required></label><label>Message*<textarea name="message" rows="6" required></textarea></label><button class="button" type="submit">Preview form only</button></form></main></body></html>
